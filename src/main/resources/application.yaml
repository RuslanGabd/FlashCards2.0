server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quizlet_db
    username: quizlet_user
    password: secret123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      pool-name: HikariPool
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # or none / update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
