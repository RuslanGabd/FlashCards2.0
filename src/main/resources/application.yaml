server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quizlet_db}
    username: ${DB_USER:quizlet_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      pool-name: HikariPool
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

yandex:
  dictionary:
    api-key: ${YANDEX_DICTIONARY_API_KEY:}
    lookup-url: https://dictionary.yandex.net/api/v1/dicservice.json/lookup

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  chat-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

forvo:
  api-key: ${FORVO_API_KEY:}
  api-base-url: https://apifree.forvo.com
  cache:
    positive-ttl: PT720H
    negative-ttl: PT24H

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: PT1H
