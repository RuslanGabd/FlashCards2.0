server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5432/quizlet_db
    username: quizlet_user
    password: secret123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      pool-name: HikariPool
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # or none / update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

yandex:
  dictionary:
    api-key: ${YANDEX_DICTIONARY_API_KEY:dict.1.1.20260730T105924Z.250aa70183d46d0a.232968128c1d7b15da1cbacf354187ed7d7835ca}
    lookup-url: https://dictionary.yandex.net/api/v1/dicservice.json/lookup

deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-f21a69cbd5914427adaf451cc521678e}
  chat-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat

forvo:
  api-key: ${FORVO_API_KEY:0a0c7d3423137ba3a93106300b50224b}
  api-base-url: https://apifree.forvo.com
  cache:
    positive-ttl: PT720H
    negative-ttl: PT24H
