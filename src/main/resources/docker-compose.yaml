version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: quizlet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: quizlet_db
      POSTGRES_USER: quizlet_user
      POSTGRES_PASSWORD: secret123   # ✅ REQUIRED
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
