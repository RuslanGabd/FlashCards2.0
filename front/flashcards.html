<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards – Words Up</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
    <div class="container">
        <h1 class="logo">Words Up</h1>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="#">My Sets</a>
            <a href="#">Login</a>
        </nav>
    </div>
</header>

<main class="flashcard-section">
    <div class="container">
        <h2>Flashcards: Basic English → Russian</h2>
        <div class="flashcard-grid">
            <!-- Flashcard 1 -->
            <div class="flashcard">
                <div class="card-inner">
                    <div class="card-front">
                        <p>Hello</p>
                    </div>
                    <div class="card-back">
                        <p>Привет</p>
                    </div>
                </div>
            </div>

            <!-- Flashcard 2 -->
            <div class="flashcard">
                <div class="card-inner">
                    <div class="card-front">
                        <p>Thank you</p>
                    </div>
                    <div class="card-back">
                        <p>Спасибо</p>
                    </div>
                </div>
            </div>

            <!-- Flashcard 3 -->
            <div class="flashcard">
                <div class="card-inner">
                    <div class="card-front">
                        <p>Goodbye</p>
                    </div>
                    <div class="card-back">
                        <p>До свидания</p>
                    </div>
                </div>
            </div>

            <!-- Add more cards as needed -->
        </div>
    </div>
</main>

</body>
</html>
