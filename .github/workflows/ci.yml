name: Verify application
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate isolated development configuration
        run: python3 scripts/init-env.py
      - name: Compile and run H2 tests
        run: sh ./mvnw -B -ntp verify
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend storage behavior
        run: npm run test:unit
      - name: Verify migrations and behavior on PostgreSQL 16
        run: python3 scripts/check.py postgres
      - name: Verify browser workflows against a fresh PostgreSQL database
        run: python3 scripts/check.py e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            artifacts/
            test-results/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose down -v
