services:
  postgres:
    image: postgres:16
    container_name: flashcards-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-quizlet_db}
      POSTGRES_USER: ${DB_USER:-quizlet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init-env.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
