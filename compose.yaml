services:
  postgres:
    image: postgres:16
    container_name: flashcards-postgres
    environment:
      POSTGRES_DB: quizlet_db
      POSTGRES_USER: quizlet_user
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizlet_user -d quizlet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
