services:
  postgres:
    image: postgres:16
    container_name: flashcards-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-quizlet_db}
      POSTGRES_USER: ${DB_USER:-quizlet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init-env.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    profiles: [app]
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-quizlet_db}
      DB_USER: ${DB_USER:-quizlet_user}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      YANDEX_DICTIONARY_API_KEY: ${YANDEX_DICTIONARY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FORVO_API_KEY: ${FORVO_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
